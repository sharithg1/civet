# Groups the notes that `gh release create --generate-notes` writes (see
# workflows/release.yml) by pull request label. Each PR gets exactly one of
# these labels; .claude/skills/make-pr/SKILL.md says which.
changelog:
  exclude:
    labels:
      - skip-changelog
      - duplicate
      - invalid
      - wontfix
  categories:
    - title: Breaking changes
      labels:
        - breaking-change
    - title: Features
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Performance
      labels:
        - performance
    - title: Documentation
      labels:
        - documentation
    - title: Dependencies
      labels:
        - dependencies
    - title: Maintenance
      labels:
        - maintenance
    - title: Other changes
      labels:
        - "*"
