name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt + version check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cargo.toml and tauri.conf.json versions agree
        run: scripts/check-version.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # The whole workspace, including the Tauri desktop crate (macOS-only app)
  # and the civet-e2e hardening harness.
  rust-macos:
    name: clippy + test (macOS, all crates)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: test
        run: cargo test --workspace --all-features --locked

  # civetd runs on Linux remotes: build and test everything but the desktop
  # app there too (Tauri on Linux would need webkit2gtk and isn't shipped).
  rust-linux:
    name: clippy + test (Linux, daemon crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace --exclude civet-desktop --all-targets --all-features --locked -- -D warnings
      - name: test
        run: cargo test --workspace --exclude civet-desktop --all-features --locked --no-fail-fast

  ui:
    name: desktop UI (typecheck, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/civet-desktop/ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: crates/civet-desktop/ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
