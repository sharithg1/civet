name: Release

# Pushing a tag vX.Y.Z (scripts/release.sh creates it) builds the daemons and
# the macOS app and publishes a GitHub Release; so does a manual run on a
# tag (the Cut release workflow starts it that way). Pull requests that touch
# the release machinery, and manual runs on a branch, do the same builds
# without publishing (the artifacts are kept on the workflow run). See
# docs/RELEASING.md.

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/build-remote.sh
      - scripts/check-version.sh
      - crates/civet-desktop/tauri.conf.json
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  LINUX_TARGETS: x86_64-unknown-linux-musl aarch64-unknown-linux-musl

jobs:
  version:
    name: check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      signing: ${{ steps.v.outputs.signing }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: tag, Cargo.toml and tauri.conf.json agree
        env:
          ALLOW_UNSIGNED: ${{ vars.ALLOW_UNSIGNED_RELEASES }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$(scripts/check-version.sh "$GITHUB_REF_NAME")
          else
            version=$(scripts/check-version.sh)
          fi
          # Signing policy: a stable tag (no "-suffix") must be signed with a
          # Developer ID and notarized, unless the repository variable
          # ALLOW_UNSIGNED_RELEASES is "true". Pre-release tags, pull requests
          # and branch runs sign when the secrets exist and are ad-hoc otherwise.
          signing=optional
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            case "$version" in
              *-*) ;;
              *) [ "$ALLOW_UNSIGNED" = true ] || signing=required ;;
            esac
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "signing=$signing" >> "$GITHUB_OUTPUT"
          echo "Civet $version (signing: $signing)" >> "$GITHUB_STEP_SUMMARY"

  # The release commit is pushed with GITHUB_TOKEN (Cut release) or as a tag,
  # neither of which runs CI on it: run it here and publish only if it passes.
  ci:
    name: CI
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/ci.yml

  # Every civetd the release ships, built once (one job per target, in
  # parallel): published standalone and copied into each app bundle, so the
  # bundled and the downloadable daemons are the same files.
  daemons:
    name: civetd (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # run: the runner can execute the binary (checked with `civetd version`).
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, run: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, run: false }
          - { target: aarch64-apple-darwin, os: macos-latest, run: true }
          - { target: x86_64-apple-darwin, os: macos-latest, run: false }
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - if: contains(matrix.target, '-linux-')
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - if: contains(matrix.target, '-linux-')
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.4
      - uses: Swatinem/rust-cache@v2
        with:
          key: daemon-${{ matrix.target }}
      - name: build
        run: scripts/build-remote.sh --out dist ${{ matrix.target }}
      - name: check version
        run: |
          f=dist/civetd-${{ matrix.target }}
          # The marker the app checks before using a daemon (bootstrap::VERSION_MARKER).
          v=$(perl -0777 -ne 'print $1 if /\0CIVETD_VERSION=([^\0]{1,64})\0/' "$f")
          [ "$v" = "$VERSION" ] || { echo "::error::$f is civetd '$v', expected $VERSION"; exit 1; }
          if [ "${{ matrix.run }}" = true ]; then
            "$f" version
            "$f" version | grep -q "civetd $VERSION "
          fi
      - name: sign
        if: contains(matrix.target, '-apple-darwin')
        env:
          SIGNING: ${{ needs.version.outputs.signing }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            if [ "$SIGNING" = required ]; then
              echo "::error::Stable releases must be signed: set the APPLE_* secrets, or the repository variable ALLOW_UNSIGNED_RELEASES=true (docs/RELEASING.md)."
              exit 1
            fi
            echo "No signing secrets: the daemon keeps its linker ad-hoc signature."
            exit 0
          fi
          keychain="$RUNNER_TEMP/civet-signing.keychain-db"
          kc_pass=$(openssl rand -hex 16)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$keychain" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          f=dist/civetd-${{ matrix.target }}
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$f"
          codesign --verify --verbose "$f"
      - uses: actions/upload-artifact@v4
        with:
          name: daemon-${{ matrix.target }}
          path: dist/civetd-${{ matrix.target }}
          if-no-files-found: error

  app:
    name: Civet.app (${{ matrix.arch }})
    needs: [version, daemons]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
          - target: x86_64-apple-darwin
            arch: x86_64
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: Cargo.lock is up to date
        # `tauri build` runs cargo without --locked; fail here instead of
        # building from a lockfile it silently rewrote.
        run: cargo fetch --locked
      - uses: Swatinem/rust-cache@v2
        with:
          key: app-${{ matrix.target }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: crates/civet-desktop/ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: crates/civet-desktop/ui

      - uses: actions/download-artifact@v4
        with:
          pattern: daemon-*
          merge-multiple: true
          path: ${{ runner.temp }}/daemons
      - name: stage bundled daemons
        # The app bundles civetd for both Linux remotes and its own Mac
        # (tauri.conf.json bundle.resources); the app checks they are its version.
        run: |
          dist=crates/civet-desktop/civet-dist
          rm -rf "$dist" && mkdir -p "$dist"
          for t in $LINUX_TARGETS ${{ matrix.target }}; do
            install -m 755 "$RUNNER_TEMP/daemons/civetd-$t" "$dist/civetd-$t"
          done
          ls -l "$dist"

      - name: signing configuration
        env:
          SIGNING: ${{ needs.version.outputs.signing }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Only set the variables Tauri reads when the secrets exist: an empty
        # APPLE_CERTIFICATE would make it try (and fail) to import one.
        run: |
          put() { { echo "$1<<__CIVET_EOF__"; echo "$2"; echo "__CIVET_EOF__"; } >> "$GITHUB_ENV"; }
          if [ "$SIGNING" = required ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              if [ -z "${!v}" ]; then
                echo "::error::Stable releases must be signed and notarized: secret $v is not set (or set the repository variable ALLOW_UNSIGNED_RELEASES=true; see docs/RELEASING.md)."
                exit 1
              fi
            done
          fi
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::add-mask::$APPLE_SIGNING_IDENTITY"
            put APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
            put APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
            put APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              put APPLE_ID "$APPLE_ID"
              put APPLE_PASSWORD "$APPLE_PASSWORD"
              put APPLE_TEAM_ID "$APPLE_TEAM_ID"
              echo "Signing with Developer ID and notarizing." | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "Signing with Developer ID; not notarizing (APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID unset)." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          else
            # Ad-hoc signature: the bundle is sealed, but Gatekeeper still
            # blocks the downloaded app until its quarantine flag is removed.
            put APPLE_SIGNING_IDENTITY "-"
            echo "Unsigned build (ad-hoc signature): see docs/RELEASING.md for the xattr workaround." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # Installed apps update themselves from latest.json (src/updater.rs),
        # which needs the .app.tar.gz signed with this key: required for tags.
        run: |
          put() { { echo "$1<<__CIVET_EOF__"; echo "$2"; echo "__CIVET_EOF__"; } >> "$GITHUB_ENV"; }
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            put TAURI_SIGNING_PRIVATE_KEY "$TAURI_SIGNING_PRIVATE_KEY"
            put TAURI_SIGNING_PRIVATE_KEY_PASSWORD "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            echo "UPDATER_ARTIFACTS=1" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is not set: installed apps could not update to this release (docs/RELEASING.md)."
            exit 1
          else
            echo "No updater key: building without the in-app update bundle." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: tauri build
        working-directory: crates/civet-desktop/ui
        env:
          # The daemons are already staged in civet-dist (see above).
          CIVET_SKIP_DAEMONS: '1'
          # Shown in the About window (build.rs).
          CIVET_COMMIT: ${{ github.sha }}
          TARGET: ${{ matrix.target }}
        run: |
          args=(--ci --target "$TARGET" --bundles "app,dmg")
          if [ "${UPDATER_ARTIFACTS:-}" = 1 ]; then
            # Civet.app.tar.gz + .sig for the updater (off in tauri.conf.json
            # so local builds need no key).
            args+=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          fi
          pnpm tauri build "${args[@]}"

      - name: check and collect bundle
        run: |
          bundle="target/${{ matrix.target }}/release/bundle"
          app="$bundle/macos/Civet.app"
          ls -l "$app/Contents/Resources/civet-dist"
          for t in $LINUX_TARGETS ${{ matrix.target }}; do
            f="$app/Contents/Resources/civet-dist/civetd-$t"
            v=$(perl -0777 -ne 'print $1 if /\0CIVETD_VERSION=([^\0]{1,64})\0/' "$f")
            [ "$v" = "$VERSION" ] || { echo "::error::$f is civetd '$v', expected $VERSION"; exit 1; }
          done
          plist_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          [ "$plist_version" = "$VERSION" ] || { echo "::error::Info.plist version $plist_version != $VERSION"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          mkdir -p out
          dmgs=("$bundle"/dmg/*.dmg)
          if [ ${#dmgs[@]} != 1 ] || [ ! -f "${dmgs[0]}" ]; then
            echo "::error::expected one dmg, got: ${dmgs[*]}"; exit 1
          fi
          cp "${dmgs[0]}" "out/Civet_${VERSION}_macos-${{ matrix.arch }}.dmg"
          ditto -c -k --keepParent "$app" "out/Civet_${VERSION}_macos-${{ matrix.arch }}.app.zip"
          if [ "${UPDATER_ARTIFACTS:-}" = 1 ]; then
            cp "$bundle/macos/Civet.app.tar.gz" "out/Civet_${VERSION}_macos-${{ matrix.arch }}.app.tar.gz"
            cp "$bundle/macos/Civet.app.tar.gz.sig" "out/Civet_${VERSION}_macos-${{ matrix.arch }}.app.tar.gz.sig"
          fi
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  publish:
    name: publish GitHub Release
    if: github.ref_type == 'tag'
    needs: [version, ci, daemons, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: latest.json (in-app updates)
        working-directory: assets
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ github.ref_name }}
        # The updater reads releases/latest/download/latest.json: the newest
        # published, non-prerelease release. The signatures live in it, so
        # the .sig files are not uploaded.
        run: |
          base="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/$TAG"
          platforms='{}'
          for arch in aarch64 x86_64; do
            tgz="Civet_${VERSION}_macos-$arch.app.tar.gz"
            [ -f "$tgz" ] && [ -f "$tgz.sig" ] || { echo "::error::missing $tgz or its .sig"; exit 1; }
            platforms=$(jq --arg k "darwin-$arch" --arg url "$base/$tgz" --rawfile sig "$tgz.sig" \
              '. + {($k): {url: $url, signature: $sig}}' <<<"$platforms")
            rm "$tgz.sig"
          done
          jq -n --arg version "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/$TAG" \
            --argjson platforms "$platforms" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: $platforms}' > latest.json
          cat latest.json
      - name: checksums
        working-directory: assets
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        # A published release is never changed: its assets are what users
        # downloaded and checked against SHA256SUMS. The assets go into a
        # draft first, are downloaded back and compared, and only then is the
        # draft published, so a failed upload never leaves a half-replaced release.
        run: |
          while draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); do
            if [ "$draft" != true ]; then
              echo "::error::Release $TAG is already published; leaving its assets alone. To replace it, delete the release on GitHub and re-run, or cut a new version."
              exit 1
            fi
            echo "Deleting the unpublished draft of $TAG left by an earlier run."
            gh release delete "$TAG" --yes
          done

          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" assets/* --draft --verify-tag --generate-notes \
            --title "Civet $TAG" "${flags[@]}"

          mkdir uploaded
          gh release download "$TAG" --dir uploaded
          diff <(cd assets && sha256sum -- *) <(cd uploaded && sha256sum -- *) || {
            echo "::error::The draft's assets differ from the built ones; the draft is left unpublished."
            exit 1
          }

          gh release edit "$TAG" --draft=false
          echo "Published ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
