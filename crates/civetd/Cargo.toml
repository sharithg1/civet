[package]
name = "civetd"
description = "Civet daemon (civetd) and CLI test client (civet-cli)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "civetd"
